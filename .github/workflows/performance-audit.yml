name: Performance Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly performance audit
    - cron: '0 9 * * 1' # Every Monday at 9 AM
  workflow_dispatch:

jobs:
  performance-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}

      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          npm install
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Optimize CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Analyze Bundle Size 📊
        run: |
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "| Asset Type | Size | Compressed |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|------|------------|" >> $GITHUB_STEP_SUMMARY
          
          # CSS files
          for file in _site/assets/css/*.css; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" | numfmt --to=iec)
              gzip_size=$(gzip -c "$file" | wc -c | numfmt --to=iec)
              echo "| CSS $(basename "$file") | $size | $gzip_size |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          # JS files
          for file in _site/assets/js/*.js; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file" | numfmt --to=iec)
              gzip_size=$(gzip -c "$file" | wc -c | numfmt --to=iec)
              echo "| JS $(basename "$file") | $size | $gzip_size |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Run Lighthouse CI 🏮
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true