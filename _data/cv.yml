- title: Research Interests
  type: nested_list
  contents:
    - title: Neuromorphic Computing
      items:
        - Brain-inspired hardware, spiking neural networks (SNNs), event-driven sensing/compute
        - On-chip learning (STDP), crossbar synapses, oscillatory/phase-change/spintronic neurons
        - Temporal coding, algorithm-device co-design, low-power edge intelligence
    - title: Machine Learning Hardware
      items:
        - DNN/GNN/Transformer accelerators, systolic and dataflow architectures
        - Sparsity- and quantization-aware compute, mixed-signal MACs
        - Compute-in-memory, near-memory compute, memory hierarchies
        - Compilation and mapping, performance/energy modeling
    - title: Emerging Devices
      items:
        - Spintronics (STT/SOT-MRAM), FeFET/NCFET, RRAM/PCM memristors
        - 2D materials, analog programmability, endurance and variability
    - title: Semiconductor Process Integration
      items:
        - Device fabrication, FEOL/BEOL and BEOL-compatible memory
        - 3D monolithic integration, DTCO (design-technology co-optimization)
        - Compact modeling, variability and yield, process-device-circuit co-design
    - title: AI for Semiconductor
      items:
        - ML for process/device optimization, virtual metrology, yield prediction and defect classification
        - Bayesian optimization and surrogate modeling, inverse design
        - Reinforcement learning for tool control

