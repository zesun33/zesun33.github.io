        - Designed and executed Design of Experiments (DOE) for exploratory thin film deposition projects, contributing to advanced technology node development
        - Investigated first-of-its-kind process integration tool for advanced technology node development, evaluating integration feasibility and process window optimization
        - Conducted comprehensive material characterization using DSIMS, XRR, stress analysis, and TEM image analysis to validate process performance and material properties
        - Developed predictive analysis framework using AI and machine learning to assess thin film deposition impact on semiconductor process flows and device characteristics
    - title: Graduate Research Assistant
      institution: Penn State, State College, PA
      year: 08/2022 - Present
      description:
        - Developed fabrication processes for and characterized spintronic devices; also performed electrical characterization of Ferroelectric FETs (FeFETs) to extract key performance parameters
        - Engineered physics-based device models using TCAD (Silvaco/Sentaurus) and developed compact models in Verilog-A and MATLAB from characterization data for circuit simulation
        - Architecting a novel, high-performance ML accelerator tailored for Transformer-based workloads, focusing on hardware-software co-design principles
        - Pioneered a hardware-aware training framework to integrate fabricated spintronic devices into system-level designs, co-optimizing device physics and ML model performance
        - Investigated advanced neuromorphic and brain-inspired algorithms (e.g., Equilibrium Propagation, Astromorphic Transformer), evaluating their performance against traditional DNN/SNN models
        - Developed an adaptive Spike-Timing-Dependent Plasticity (STDP) learning rule for Dynamic Spiking Neural Networks (SNNs) to enable continual learning, with performance validated in cybersecurity threat detection scenarios
